name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bizflow
          POSTGRES_PASSWORD: bizflow
          POSTGRES_DB: bizflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U bizflow -d bizflow"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://bizflow:bizflow@localhost:5432/bizflow?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run build
